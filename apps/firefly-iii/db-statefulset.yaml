apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: firefly-db
spec:
  serviceName: "firefly-db"
  replicas: 1
  selector:
    matchLabels:
      app: firefly-db
  template:
    metadata:
      labels:
        app: firefly-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: "firefly"
            - name: POSTGRES_USER
              value: "firefly"
            - name: POSTGRES_PASSWORD
              value: "change-me-in-production"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "openebs-hostpath"
        resources:
          requests:
            storage: 5Gi
